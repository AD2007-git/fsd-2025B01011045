<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleStore - Clothing E-Commerce</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

/* Header */
header{
    background:#111;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    color:#ff9800;
}

nav a{
    color:white;
    margin-left:20px;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#ff9800;
}

/* Hero Section */
.hero{
    background:url("https://images.unsplash.com/photo-1521334884684-d80222895322") center/cover no-repeat;
    height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
}

.hero h2{
    font-size:40px;
    background:rgba(0,0,0,0.6);
    padding:15px 25px;
}

/* Products */
.products{
    padding:40px;
}

.products h2{
    text-align:center;
    margin-bottom:30px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.product{
    background:white;
    padding:15px;
    border-radius:8px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.product img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:5px;
}

.product h3{
    margin:10px 0;
}

.product p{
    color:#555;
}

.product button{
    margin-top:10px;
    padding:10px 15px;
    border:none;
    background:#ff9800;
    color:white;
    cursor:pointer;
    border-radius:5px;
    font-size:15px;
}

.product button:hover{
    background:#e68900;
}

/* Footer */
footer{
    background:#111;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
    <h1>StyleStore</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Men</a>
        <a href="#">Women</a>
        <a href="#">Cart</a>
    </nav>
</header>

<section class="hero">
    <h2>Latest Fashion Collection</h2>
</section>

<section class="products">
    <h2>Our Products</h2>

    <div class="product-grid">

        <div class="product">
            <img src="https://i.pinimg.com/originals/03/a6/45/03a6456f76bc590663aff0a08d4e85be.png" alt="T-Shirt">
            <h3>Men's T-Shirt</h3>
            <p>₹1499</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://i5.walmartimages.com/asr/428094f7-e983-447d-86b0-b7d180d72355_1.9a46c8de43056aeaeaf35156fc4902c1.jpeg" alt="Jacket">
            <h3>Denim Jacket</h3>
            <p>₹1,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://thumbs.dreamstime.com/b/several-shirts-hanger-white-to-black-color-range-55460705.jpg" alt="Shirts">
            <h3>Men's Shirts</h3>
            <p>₹1,499</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src=" https://prod-img.thesouledstore.com/public/theSoul/uploads/catalog/product/1758793855_2698293.jpg?w=1080&dpr=2 alt="Hoodie">
            <h3>Stylish Hoodie</h3>
            <p>₹1,999</p>
            <button>Add to Cart</button>
        </div>

    </div>
</section>

<footer>
    <p>© 2025 StyleStore | All Rights Reserved</p>
</footer>

</body>
</html>
